# Automated dependency-update PRs and security alerts.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Python backend (Django/DRF/etc.)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Django 5.2 is the LTS line (security fixes until April 2028); 6.0 and 6.1
    # are short-lived feature releases. Without this, every weekly group PR
    # bundles a Django major upgrade with the routine updates. Lift it when
    # moving to 6.2 LTS (April 2027). 5.2.x patch releases still come through.
    ignore:
      - dependency-name: "Django"
        update-types: ["version-update:semver-major"]
    groups:
      python-packages:
        patterns:
          - "*"

  # React frontend
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-packages:
        patterns:
          - "*"

  # GitHub Actions (if/when workflows are added)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
