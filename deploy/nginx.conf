# GertiFoods Nginx site config.
# Place at /etc/nginx/sites-available/gertifoods and symlink into sites-enabled.
# This is the HTTP-only starting point; `certbot --nginx` rewrites it to add
# the HTTPS (443) server block and an http->https redirect automatically.

# Picks the 404 document matching the URL's locale prefix, so a broken link
# under /de lands on the German 404 rather than the Albanian one. Astro builds
# all three (dist/404.html, dist/en/404.html, dist/de/404.html) from
# frontend/astro/pages/404.astro and pages/[lang]/404.astro.
#
# A map keeps this to one rule; the alternative — a location block per locale —
# would duplicate the whole security-header stack three times.
map $uri $notfound_page {
    default    /404.html;
    ~^/en(/|$) /en/404.html;
    ~^/de(/|$) /de/404.html;
}

server {
    listen 80;
    listen [::]:80;
    server_name gertifoods.com www.gertifoods.com;

    # Max upload size (lead attachments, etc.)
    client_max_body_size 10M;

    # React (Vite) production build
    root /var/www/gertifoods/frontend/dist;
    index index.html;

    # Django collected static files (admin, DRF browsable API)
    location /static/ {
        alias /var/www/gertifoods/staticfiles/;
        access_log off;
        expires 30d;
    }

    # User-uploaded media
    location /media/ {
        alias /var/www/gertifoods/media/;
        access_log off;
        expires 30d;
    }

    # API + Django admin -> Gunicorn. The admin is mounted under the api/ prefix
    # at a non-guessable path (DJANGO_ADMIN_URL), so only /api/ needs proxying;
    # the literal /admin/ falls through to the SPA, revealing no Django backend.
    location ~ ^/api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required so Django (SECURE_PROXY_SSL_HEADER) knows the request was HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dynamic sitemap index and its category files -> Gunicorn. This matches
    # /sitemap.xml plus the pages, products, areas-we-serve and blog category
    # files, while rejecting unrelated nested paths.
    location ~ ^/sitemap(?:-[a-z0-9-]+)?\.xml$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Astro build output: every file under /_astro/ is content-hashed, so it can
    # be cached forever. This clears the Lighthouse "efficient cache lifetimes"
    # finding for the CSS/JS/image bundle.
    location /_astro/ {
        alias /var/www/gertifoods/frontend/dist/_astro/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # The previous Vite build emitted content-hashed files under /assets/.
    # Kept so links and caches pointing at the old bundle keep resolving for a
    # while after cutover; safe to delete once the old paths stop appearing in
    # the access log.
    location /assets/ {
        alias /var/www/gertifoods/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # The LCP hero is preloaded and not content-hashed, so give it an explicit
    # cache lifetime (an exact-match location, to avoid shadowing the /static
    # and /media aliases the way a generic image regex would). Bust by renaming
    # if the hero ever changes.
    location = /hero.webp {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Document requests.
    #
    # Security headers live here (not server-wide) so they apply to the React
    # app — whose HTML nginx serves directly and which therefore never receives
    # Django's middleware headers — without touching the proxied /admin and
    # browsable /api responses, which rely on their own inline scripts/styles.
    location / {
        # Content-Security-Policy. 'unsafe-inline' is required by the inline
        # Google Analytics bootstrap in index.html and React's inline style
        # attributes; the real XSS hardening here is the locked-down exfiltration
        # sinks (connect-src, img-src, object-src, base-uri, form-action), which
        # stop a stolen token from being sent to an attacker-controlled host.
        # Tightening script-src to a nonce/hash needs index.html rendered by
        # Django; revisit if that becomes worthwhile.
        #
        # reCAPTCHA v3 needs three of these entries and fails closed without
        # them: it loads api.js from www.google.com, which pulls its worker from
        # www.gstatic.com, and it drops an invisible anchor iframe that the
        # default-src fallback would otherwise block. They are path-scoped to
        # /recaptcha/ as Google documents, so allowing them does not open up
        # those hosts generally. Leaving them out does not degrade gracefully —
        # the script load fails, getRecaptchaToken() rejects, and every lead
        # form reports a generic error without ever reaching the API.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.g.doubleclick.net https://*.google.com https://www.facebook.com; font-src 'self' data:; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://*.g.doubleclick.net https://*.google.com https://www.facebook.com; frame-src 'self' https://www.google.com/recaptcha/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # tools=(self) opts this origin into WebMCP, letting agentic browsers
        # discover the tools registered in the SPA (see WebMCPTools.jsx).
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), tools=(self)" always;
        # HSTS for the document responses nginx serves (Django sets its own on
        # /api and /admin). Harmless over plain HTTP — browsers ignore it until
        # served over HTTPS, which Certbot enables in step 10.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # HTML documents must always be revalidated. They are tiny and reference
        # the content-hashed /assets/ bundles, which are cached `immutable` for a
        # year. If the HTML itself were heuristically cached (it has no explicit
        # Cache-Control otherwise), a returning browser would keep serving a stale
        # index.html pinned to an old bundle hash and never pick up a new deploy.
        # `no-cache` still allows storage + 304 revalidation via ETag, so it's
        # cheap — it just guarantees the browser checks for a fresh build.
        add_header Cache-Control "no-cache" always;

        # Astro emits flat files (build.format: 'file'), so a URL like /about
        # has no trailing-slash form on disk. Redirect rather than 404: the old
        # /index.html fallback used to absorb /about/ and let the SPA route it
        # client-side, and inbound links in that shape still exist. 301 also
        # points them at the canonical URL for good. The pattern requires a
        # character before the slash, so "/" itself never matches.
        rewrite ^(/.+)/$ $1 permanent;

        # Serve the statically built page for each route (e.g. /about ->
        # about.html, /de/areas/kosovo -> de/areas/kosovo.html).
        #
        # The final `=404` replaces what used to be an /index.html fallback.
        # That fallback answered every unknown URL with the home page and a
        # 200, which is a soft 404: Googlebot saw an unbounded supply of valid
        # pages and spent crawl budget discovering them. Unknown URLs now
        # return a real 404 and the branded page below.
        #
        # $uri/index.html is what serves "/". The bare $uri check does not: for
        # "/" it is a directory test, which try_files does not resolve to the
        # index file, so dropping it would 404 the home page. (Verified — the
        # first draft of this line did exactly that.) merge_slashes collapses
        # the "//index.html" that "/" produces. No other route reaches it,
        # since build.format 'file' emits about.html, never about/index.html.
        try_files $uri $uri.html $uri/index.html =404;

        # Scoped to this location on purpose: /api/, /static/, /media/ and the
        # hashed-asset locations keep nginx's default plain 404, since serving
        # a full HTML page for a missing script or image is just waste.
        error_page 404 $notfound_page;

        # ...and the same goes for assets requested from the site root, which
        # /_astro/ and /assets/ do not cover — a stale /main.css or a mistyped
        # /logo.webp lands here. Without this block they cost 36 KB of branded
        # HTML instead of nginx's 153-byte 404, and nothing renders an HTML
        # document into an <img> or <link> anyway.
        #
        # Nested inside location / deliberately: a top-level regex location
        # would take precedence over the /static/, /media/, /_astro/ and
        # /assets/ prefixes and hijack their files. Nested, it is only ever
        # consulted once location / has already been selected, so those four
        # keep their aliases and immutable cache headers untouched.
        #
        # .html, .xml and .txt are absent on purpose: sitemaps have their own
        # proxied location, and robots.txt/llms.txt stay on the document path
        # so they keep the security headers above.
        location ~* \.(?:css|js|mjs|map|avif|webp|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|pdf|webmanifest)$ {
            try_files $uri =404;
            # Replaces the inherited branded error_page for these paths only.
            error_page 404 @plain_404;
        }
    }

    # Bare 404, no body of consequence. Exists solely so the asset block above
    # has something to point error_page at: nginx has no "error_page off".
    location @plain_404 {
        return 404;
    }
}
